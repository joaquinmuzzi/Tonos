[project]
name = "orfeo"
version = "0.1.0"
description = "Local, offline music analysis: tempo, meter, key and chords, bar by bar."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Joaquín Muzzi" }]
# The application is installed from requirements.txt (see install.ps1 and CONTRIBUTING);
# this file holds the project metadata and the tool configuration.
requires-python = ">=3.12,<3.13"

[project.urls]
Repository = "https://github.com/joaquinmuzzi/orfeo"
Issues = "https://github.com/joaquinmuzzi/orfeo/issues"

[dependency-groups]
# Development tools: pip install --group dev
dev = ["pytest", "ruff==0.17.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uses the real models (takes about a minute)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
extend-exclude = [".claude"]

[tool.ruff.lint]
# Explicit selection, so that new Ruff versions do not change the rule set
select = [
    "E4", "E7", "E9", # pycodestyle errors
    "F",              # pyflakes
    "I",              # import sorting
    "B",              # bugbear
    "UP",             # pyupgrade
    "SIM",            # simplify
    "PT",             # pytest style
    "RUF",            # Ruff-specific
]
# zip() mostly walks arrays that are aligned by construction; strict= would only add noise
ignore = ["B905"]

[tool.ruff.format]
docstring-code-format = true
