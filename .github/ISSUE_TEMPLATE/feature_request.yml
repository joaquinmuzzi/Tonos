name: Feature request
description: Suggest an idea for Tonos.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or the use case, rather than the solution.
      placeholder: "When I practise a song I want to slow it down without changing the pitch..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could Tonos help?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
